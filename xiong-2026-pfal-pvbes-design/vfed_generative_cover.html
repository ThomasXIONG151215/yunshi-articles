<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFED - Energy Baseline Generative Cover</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group { margin-bottom: 16px; }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 100px;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>VFED Energy Art</h1>
            <div class="subtitle">Generative cover for Vertical Farm Energy Designer</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="2026" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Density</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="3000" step="100" value="1200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Coherence</label>
                    <div class="slider-container">
                        <input type="range" id="coherence" min="0.1" max="1.0" step="0.05" value="0.5" oninput="updateParam('coherence', this.value)">
                        <span class="value-display" id="coherence-value">0.50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Energy Arc Width</label>
                    <div class="slider-container">
                        <input type="range" id="arcWidth" min="2" max="12" step="1" value="6" oninput="updateParam('arcWidth', this.value)">
                        <span class="value-display" id="arcWidth-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Climate Zones</label>
                    <div class="slider-container">
                        <input type="range" id="zones" min="3" max="7" step="1" value="5" oninput="updateParam('zones', this.value)">
                        <span class="value-display" id="zones-value">5</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Solar / Energy</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorSolar" value="#fbb824" onchange="updateColor('colorSolar', this.value)">
                        <span class="color-value" id="colorSolar-value">#fbb824</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Container / Steel</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorSteel" value="#4b5563" onchange="updateColor('colorSteel', this.value)">
                        <span class="color-value" id="colorSteel-value">#4b5563</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Data Blue</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorData" value="#4285f4" onchange="updateColor('colorData', this.value)">
                        <span class="color-value" id="colorData-value">#4285f4</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button tertiary" onclick="noLoop()">Freeze</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // VFED ENERGY FLOW GENERATIVE ART
        // Concept: Energy flows from sun through PV system to plant factory
        // ═══════════════════════════════════════════════════════════════

        let params = {
            seed: 2026,
            particleCount: 1200,
            coherence: 0.5,
            arcWidth: 6,
            zones: 5,
            colorSolar: '#fbb824',
            colorSteel: '#4b5563',
            colorData: '#4285f4'
        };

        let defaultParams = {...params};
        let particles = [];
        let flowField = [];
        let cols, rows;
        let scl = 12;
        let t = 0;

        // Climate zone colors
        let climateColors = [
            [66, 133, 244],   // Lhasa - clear blue
            [251, 188, 5],    // Haikou - tropical yellow
            [234, 134, 83],   // Shanghai - warm orange
            [158, 115, 180],  // Urumqi - continental purple
            [100, 116, 139],  // Harbin - northern slate
        ];

        function setup() {
            let canvas = createCanvas(1200, 800);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
            noLoop(); // Static by default, user can unfreeze
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Calculate flow field
            cols = floor(width / scl);
            rows = floor(height / scl);
            flowField = [];

            for (let i = 0; i < cols * rows; i++) {
                flowField.push(0);
            }

            // Init particles
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new EnergyParticle());
            }

            background(250, 249, 245);
            t = 0;
        }

        function generateFlowField() {
            // Create flow field from sun (top center) radiating downward
            let sunX = width / 2;
            let sunY = height * 0.15;
            let sunR = 80;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let idx = y * cols + x;
                    let wx = x * scl + scl/2;
                    let wy = y * scl + scl/2;

                    // Angle from sun
                    let angle = atan2(wy - sunY, wx - sunX);

                    // Distance from sun
                    let d = dist(wx, wy, sunX, sunY);

                    // Radial flow with some noise
                    let noiseVal = noise(x * 0.05, y * 0.05, t * 0.001) * TWO_PI;
                    let coherence = params.coherence;

                    // Particles flow outward from sun, then curve down
                    let flowAngle = angle + noiseVal * (1 - coherence) * 2;

                    // Add downward bias based on distance
                    if (d > sunR * 2) {
                        let downBias = map(min(d, 500), sunR * 2, 500, 0, PI * 0.4);
                        flowAngle = PI/2 + (flowAngle - PI/2) * (1 - downBias * 0.5);
                    }

                    flowField[idx] = flowAngle;
                }
            }
        }

        function drawSun() {
            let sunX = width / 2;
            let sunY = height * 0.15;
            let sunR = 60;

            // Glow
            noStroke();
            for (let i = 5; i > 0; i--) {
                let alpha = map(i, 5, 0, 5, 40);
                fill(251, 191, 36, alpha);
                ellipse(sunX, sunY, sunR * 2 + i * 15, sunR * 2 + i * 15);
            }

            // Core
            fill(251, 191, 36);
            ellipse(sunX, sunY, sunR * 2, sunR * 2);

            // Inner bright
            fill(255, 235, 150);
            ellipse(sunX, sunY, sunR * 1.2, sunR * 1.2);

            // Label
            fill(28, 27, 26);
            textFont('Poppins');
            textSize(14);
            textAlign(CENTER, CENTER);
            text('SOLAR', sunX, sunY + sunR + 25);
        }

        function drawClimateZones() {
            let zoneCount = params.zones;
            let zoneW = width / zoneCount;

            for (let i = 0; i < zoneCount; i++) {
                let x = i * zoneW;
                let col = climateColors[i % climateColors.length];

                // Subtle zone gradient at bottom
                for (let y = height - 120; y < height; y++) {
                    let alpha = map(y, height - 120, height, 0, 30);
                    stroke(col[0], col[1], col[2], alpha);
                    line(x, y, x + zoneW, y);
                }

                // Zone label
                fill(col[0], col[1], col[2], 150);
                textSize(11);
                textAlign(CENTER, BOTTOM);
                let zoneNames = ['拉萨', '海口', '上海', '乌鲁木齐', '哈尔滨', '北京', '昆明'];
                text(zoneNames[i % zoneNames.length], x + zoneW/2, height - 20);
            }
        }

        function drawContainer() {
            let cx = width / 2;
            let cy = height * 0.68;
            let w = 200;
            let h = 100;

            // Shadow
            noStroke();
            fill(0, 0, 0, 15);
            ellipse(cx, cy + h/2 + 15, w + 20, 30);

            // Container body
            fill(75, 85, 99);
            stroke(55, 65, 79);
            strokeWeight(2);
            rectMode(CENTER);
            rect(cx, cy, w, h, 4);

            // Roof
            noStroke();
            fill(100, 116, 139);
            beginShape();
            vertex(cx - w/2 - 8, cy - h/2);
            vertex(cx, cy - h/2 - 35);
            vertex(cx + w/2 + 8, cy - h/2);
            endShape(CLOSE);

            // LED panels (warm glow inside)
            noStroke();
            for (let i = 0; i < 4; i++) {
                let px = cx - 75 + i * 42;
                fill(251, 191, 36, 180 + sin(t * 0.02 + i) * 40);
                rect(px, cy - 5, 30, 60, 2);
            }

            // Ventilation slots
            fill(55, 65, 79);
            for (let i = 0; i < 3; i++) {
                rect(cx - 80 + i * 55, cy - h/2 + 15, 35, 6, 1);
            }

            // Wheels
            fill(40, 40, 40);
            ellipse(cx - w/2 + 25, cy + h/2 + 5, 20, 20);
            ellipse(cx + w/2 - 25, cy + h/2 + 5, 20, 20);

            // Label
            fill(28, 27, 26);
            textSize(12);
            textAlign(CENTER, TOP);
            text('20ft Container Plant Factory', cx, cy + h/2 + 18);

            // PV annotation
            fill(217, 119, 87);
            textSize(10);
            text('PV + BES System', cx, cy + h/2 + 34);
        }

        function drawDataOverlay() {
            // Key numbers floating in space
            textAlign(LEFT, CENTER);

            // 10584
            fill(217, 119, 87);
            textSize(28);
            textStyle(BOLD);
            text('10,584', 60, 120);
            textStyle(NORMAL);
            fill(28, 27, 26);
            textSize(12);
            text('configurations', 60, 148);

            // 5 cities
            fill(66, 133, 244);
            textSize(28);
            textStyle(BOLD);
            text('5', 60, 200);
            textStyle(NORMAL);
            fill(28, 27, 26);
            textSize(12);
            text('climate zones', 60, 228);

            // VFED
            fill(28, 27, 26);
            textSize(32);
            textStyle(BOLD);
            text('VFED', 60, 280);
            textStyle(NORMAL);
            textSize(11);
            fill(120, 116, 102);
            text('Vertical Farm Energy Designer', 60, 312);

            // Right side - title
            textAlign(RIGHT, TOP);
            fill(28, 27, 26);
            textSize(36);
            textStyle(BOLD);
            text('植物工厂', width - 60, 80);
            text('光伏储能设计基准', width - 60, 122);
            textStyle(NORMAL);
            fill(217, 119, 87);
            textSize(16);
            text('VFED × 5气候带 × 10584配置验证', width - 60, 168);

            // Bottom attribution
            textAlign(CENTER, BOTTOM);
            fill(120, 116, 102);
            textSize(11);
            text('上海交通大学 · 熊元科 鲍华等', width/2, height - 15);
        }

        function drawFlowArcs() {
            // Draw energy flow arcs from sun to container
            let sunX = width / 2;
            let sunY = height * 0.15 + 60;
            let targetX = width / 2;
            let targetY = height * 0.68 - 50;

            stroke(217, 119, 87);
            strokeWeight(params.arcWidth);
            noFill();

            // Main energy arc
            bezier(
                sunX, sunY,
                sunX + 150, sunY + 100,
                targetX - 100, targetY - 50,
                targetX, targetY
            );

            // Secondary arcs (distributed)
            for (let offset = -80; offset <= 80; offset += 40) {
                let alpha = map(abs(offset), 0, 80, 150, 50);
                stroke(217, 119, 87, alpha);
                strokeWeight(params.arcWidth * 0.5);
                bezier(
                    sunX, sunY,
                    sunX + 150 + offset, sunY + 120 + abs(offset) * 0.5,
                    targetX - 100 + offset * 0.5, targetY - 30,
                    targetX + offset * 0.3, targetY
                );
            }
        }

        function draw() {
            background(250, 249, 245);

            // Draw elements in order
            drawClimateZones();
            drawFlowArcs();

            // Update and draw particles
            generateFlowField();

            strokeWeight(1.5);
            for (let p of particles) {
                p.follow(flowField);
                p.update();
                p.edges();
                p.display();
            }

            drawSun();
            drawContainer();
            drawDataOverlay();

            t++;
        }

        class EnergyParticle {
            constructor() {
                this.pos = createVector(random(width), random(height * 0.3));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = 2.5;
                this.prevPos = this.pos.copy();

                // Color based on position
                let zoneIdx = floor(map(this.pos.x, 0, width, 0, params.zones));
                let col = climateColors[zoneIdx % climateColors.length];
                this.color = color(col[0], col[1], col[2], 180);
            }

            follow(field) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let idx = y * cols + x;
                idx = constrain(idx, 0, flowField.length - 1);

                let angle = flowField[idx];
                let force = p5.Vector.fromAngle(angle);
                force.mult(0.3);
                this.acc.add(force);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);
            }

            display() {
                stroke(this.color);
                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                this.updatePrev();
            }

            updatePrev() {
                this.prevPos.x = this.pos.x;
                this.prevPos.y = this.pos.y;
            }

            edges() {
                if (this.pos.x > width + 10 || this.pos.x < -10 ||
                    this.pos.y > height + 10 || this.pos.y < -10) {
                    this.pos.x = random(width);
                    this.pos.y = random(height * 0.3);
                    this.updatePrev();
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // UI CONTROLS
        // ═══════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent =
                Number.isInteger(parseFloat(value)) ? value : parseFloat(value).toFixed(2);
            initializeSystem();
            loop();
        }

        function updateColor(name, value) {
            params[name] = value;
            document.getElementById(name + '-value').textContent = value;
            // Parse hex to RGB for climate colors
            if (name === 'colorSolar') {
                // Update sun/energy color - just reinitialize
            } else if (name === 'colorData') {
                let r = parseInt(value.slice(1,3), 16);
                let g = parseInt(value.slice(3,5), 16);
                let b = parseInt(value.slice(5,7), 16);
                climateColors[0] = [r, g, b];
            }
            initializeSystem();
            loop();
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
                loop();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
            loop();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
            loop();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(random(1, 999999));
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
            loop();
        }

        function resetParameters() {
            params = {...defaultParams};

            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('coherence').value = params.coherence;
            document.getElementById('coherence-value').textContent = params.coherence.toFixed(2);
            document.getElementById('arcWidth').value = params.arcWidth;
            document.getElementById('arcWidth-value').textContent = params.arcWidth;
            document.getElementById('zones').value = params.zones;
            document.getElementById('zones-value').textContent = params.zones;
            document.getElementById('colorSolar').value = params.colorSolar;
            document.getElementById('colorSolar-value').textContent = params.colorSolar;
            document.getElementById('colorSteel').value = params.colorSteel;
            document.getElementById('colorSteel-value').textContent = params.colorSteel;
            document.getElementById('colorData').value = params.colorData;
            document.getElementById('colorData-value').textContent = params.colorData;

            initializeSystem();
            loop();
        }

        window.addEventListener('load', function() {
            document.getElementById('seed-input').value = params.seed;
        });
    </script>
</body>
</html>
