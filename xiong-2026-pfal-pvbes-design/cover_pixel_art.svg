<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97757"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#faf9f5"/>

  <!-- Subtle grid background (pixel grid effect) -->
  <g opacity="0.08">
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none" stroke="#888" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- ========== TITLE SECTION ========== -->
  <!-- Title text (pixel font effect using rects) -->
  <text x="600" y="55" text-anchor="middle" font-size="38" font-weight="bold" fill="#141413" font-family="Arial Black, sans-serif">植物工厂光伏储能设计基准</text>

  <!-- Subtitle -->
  <text x="600" y="85" text-anchor="middle" font-size="18" fill="#d97757" font-family="Arial, sans-serif">VFED × 5气候带 × 10584配置验证</text>

  <!-- ========== SUN (top center) ========== -->
  <g transform="translate(600, 145)">
    <!-- Sun glow -->
    <rect x="-42" y="-42" width="84" height="84" fill="#fbb824" opacity="0.2" rx="8"/>
    <rect x="-35" y="-35" width="70" height="70" fill="#fbb824" opacity="0.3" rx="6"/>
    <!-- Sun core -->
    <rect x="-28" y="-28" width="56" height="56" fill="#fbb824" rx="4"/>
    <rect x="-21" y="-21" width="42" height="42" fill="#fcd34d" rx="3"/>
    <!-- Sun rays (pixel style) -->
    <rect x="-4" y="-56" width="8" height="14" fill="#fbb824"/>
    <rect x="-4" y="42" width="8" height="14" fill="#fbb824"/>
    <rect x="-56" y="-4" width="14" height="8" fill="#fbb824"/>
    <rect x="42" y="-4" width="14" height="8" fill="#fbb824"/>
    <!-- Label -->
    <text x="0" y="68" text-anchor="middle" font-size="11" fill="#888">SOLAR</text>
  </g>

  <!-- ========== ENERGY FLOW ARROWS ========== -->
  <!-- Sun to PV -->
  <line x1="600" y1="203" x2="520" y2="240" stroke="#d97757" stroke-width="3" marker-end="url(#arr)"/>
  <!-- PV to Battery -->
  <line x1="465" y1="250" x2="510" y2="250" stroke="#d97757" stroke-width="3" marker-end="url(#arr)"/>
  <!-- Battery to Container -->
  <line x1="555" y1="265" x2="555" y2="310" stroke="#d97757" stroke-width="3" marker-end="url(#arr)"/>
  <!-- PV to Container direct -->
  <line x1="490" y1="255" x2="520" y2="320" stroke="#d97757" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- ========== PV PANEL ========== -->
  <g transform="translate(350, 230)">
    <!-- PV array label -->
    <text x="60" y="-12" text-anchor="middle" font-size="12" fill="#d97757" font-weight="bold">PV ARRAY</text>
    <!-- Panel frame -->
    <rect x="0" y="0" width="126" height="49" fill="#4b5563" rx="3"/>
    <!-- Grid lines -->
    <rect x="4" y="4" width="55" height="19" fill="#4285f4" opacity="0.9" rx="1"/>
    <rect x="63" y="4" width="55" height="19" fill="#4285f4" opacity="0.7" rx="1"/>
    <rect x="4" y="27" width="55" height="18" fill="#4285f4" opacity="0.8" rx="1"/>
    <rect x="63" y="27" width="55" height="18" fill="#4285f4" opacity="0.6" rx="1"/>
    <!-- Panel divisions -->
    <rect x="0" y="0" width="126" height="49" fill="none" stroke="#374151" stroke-width="2" rx="3"/>
    <rect x="32" y="4" width="3" height="41" fill="#374151"/>
    <rect x="63" y="4" width="3" height="41" fill="#374151"/>
    <rect x="95" y="4" width="3" height="41" fill="#374151"/>
    <rect x="4" y="23" width="114" height="3" fill="#374151"/>
  </g>

  <!-- ========== BATTERY ========== -->
  <g transform="translate(510, 218)">
    <!-- Battery label -->
    <text x="35" y="-8" text-anchor="middle" font-size="11" fill="#788c5d" font-weight="bold">BES</text>
    <!-- Battery body -->
    <rect x="0" y="4" width="70" height="42" fill="#374151" rx="4"/>
    <!-- Battery terminal -->
    <rect x="22" y="0" width="26" height="8" fill="#4b5563" rx="2"/>
    <!-- Battery level -->
    <rect x="6" y="10" width="58" height="30" fill="#1f2937" rx="2"/>
    <rect x="8" y="12" width="54" height="12" fill="#788c5d" rx="1"/>
    <rect x="8" y="26" width="38" height="12" fill="#6b7280" rx="1"/>
    <!-- Battery segments -->
    <rect x="6" y="10" width="58" height="30" fill="none" stroke="#4b5563" stroke-width="1" rx="2"/>
  </g>

  <!-- ========== CONTAINER PLANT FACTORY ========== -->
  <g transform="translate(460, 320)">
    <!-- Container body -->
    <rect x="0" y="0" width="280" height="126" fill="#4b5563" rx="4"/>
    <!-- Container roof -->
    <polygon points="-8,0 140,-42 288,0" fill="#6b7280"/>
    <!-- LED lights inside (warm glow) -->
    <rect x="20" y="28" width="60" height="70" fill="#fef3c7" opacity="0.9" rx="2"/>
    <rect x="90" y="28" width="60" height="70" fill="#fde68a" opacity="0.85" rx="2"/>
    <rect x="160" y="28" width="60" height="70" fill="#fef3c7" opacity="0.8" rx="2"/>
    <!-- LED grid lines -->
    <rect x="20" y="28" width="240" height="70" fill="none" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <rect x="65" y="28" width="3" height="70" fill="#4b5563"/>
    <rect x="140" y="28" width="3" height="70" fill="#4b5563"/>
    <rect x="210" y="28" width="3" height="70" fill="#4b5563"/>
    <rect x="20" y="62" width="240" height="3" fill="#4b5563"/>
    <!-- Vents on top -->
    <rect x="30" y="8" width="40" height="8" fill="#374151" rx="1"/>
    <rect x="90" y="8" width="40" height="8" fill="#374151" rx="1"/>
    <rect x="150" y="8" width="40" height="8" fill="#374151" rx="1"/>
    <!-- Wheels -->
    <rect x="20" y="126" width="28" height="14" fill="#1f2937" rx="3"/>
    <rect x="232" y="126" width="28" height="14" fill="#1f2937" rx="3"/>
    <!-- Container label -->
    <text x="140" y="156" text-anchor="middle" font-size="12" fill="#4b5563">20ft Container Plant Factory</text>
  </g>

  <!-- ========== 5 CLIMATE ZONE COLUMNS ========== -->
  <g transform="translate(100, 480)">
    <!-- Zone data -->
    <!-- 拉萨 - blue -->
    <rect x="0" y="0" width="168" height="110" fill="#4285f4" opacity="0.15" rx="4"/>
    <rect x="54" y="10" width="60" height="90" fill="#4285f4" rx="2"/>
    <text x="84" y="30" text-anchor="middle" font-size="20" fill="white" font-weight="bold">40</text>
    <text x="84" y="50" text-anchor="middle" font-size="11" fill="white">m²</text>
    <text x="84" y="118" text-anchor="middle" font-size="13" fill="#4285f4" font-weight="bold">拉萨</text>

    <!-- 海口 - yellow -->
    <rect x="188" y="15" width="168" height="95" fill="#f9a825" opacity="0.15" rx="4"/>
    <rect x="242" y="25" width="60" height="85" fill="#f9a825" rx="2"/>
    <text x="272" y="50" text-anchor="middle" font-size="20" fill="white" font-weight="bold">50</text>
    <text x="272" y="70" text-anchor="middle" font-size="11" fill="white">m²</text>
    <text x="272" y="118" text-anchor="middle" font-size="13" fill="#f9a825" font-weight="bold">海口</text>

    <!-- 上海 - orange -->
    <rect x="376" y="0" width="168" height="110" fill="#ea852e" opacity="0.15" rx="4"/>
    <rect x="430" y="10" width="60" height="90" fill="#ea852e" rx="2"/>
    <text x="460" y="30" text-anchor="middle" font-size="20" fill="white" font-weight="bold">80</text>
    <text x="460" y="50" text-anchor="middle" font-size="11" fill="white">m²</text>
    <text x="460" y="118" text-anchor="middle" font-size="13" fill="#ea852e" font-weight="bold">上海</text>

    <!-- 乌鲁木齐 - purple -->
    <rect x="564" y="20" width="168" height="90" fill="#9c6ade" opacity="0.15" rx="4"/>
    <rect x="618" y="30" width="60" height="80" fill="#9c6ade" rx="2"/>
    <text x="648" y="50" text-anchor="middle" font-size="20" fill="white" font-weight="bold">110</text>
    <text x="648" y="70" text-anchor="middle" font-size="11" fill="white">m²</text>
    <text x="648" y="118" text-anchor="middle" font-size="13" fill="#9c6ade" font-weight="bold">乌鲁木齐</text>

    <!-- 哈尔滨 - slate -->
    <rect x="752" y="0" width="168" height="110" fill="#64748b" opacity="0.15" rx="4"/>
    <rect x="806" y="10" width="60" height="90" fill="#64748b" rx="2"/>
    <text x="836" y="30" text-anchor="middle" font-size="20" fill="white" font-weight="bold">120</text>
    <text x="836" y="50" text-anchor="middle" font-size="11" fill="white">m²</text>
    <text x="836" y="118" text-anchor="middle" font-size="13" fill="#64748b" font-weight="bold">哈尔滨</text>

    <!-- Baseline label -->
    <text x="460" y="-15" text-anchor="middle" font-size="12" fill="#888">TGD &lt; 5% | 20ft Container | 16m² Crop Area</text>
  </g>

  <!-- ========== LEFT PANEL - KEY STATS ========== -->
  <g transform="translate(40, 140)">
    <!-- 10584 -->
    <text x="0" y="0" font-size="32" font-weight="bold" fill="#d97757">10,584</text>
    <text x="0" y="22" font-size="12" fill="#666">组配置验证</text>

    <!-- 5 cities -->
    <text x="0" y="60" font-size="32" font-weight="bold" fill="#4285f4">5</text>
    <text x="30" y="60" font-size="16" fill="#333">气候带</text>

    <!-- VFED -->
    <text x="0" y="105" font-size="28" font-weight="bold" fill="#141413">VFED</text>
    <text x="0" y="128" font-size="10" fill="#888">Vertical Farm Energy Designer</text>

    <!-- Framework layers -->
    <rect x="0" y="155" width="120" height="22" fill="#4285f4" rx="3"/>
    <text x="60" y="170" text-anchor="middle" font-size="10" fill="white">气候数据</text>
    <rect x="0" y="181" width="120" height="22" fill="#ea852e" rx="3"/>
    <text x="60" y="196" text-anchor="middle" font-size="10" fill="white">EnergyPlus</text>
    <rect x="0" y="207" width="120" height="22" fill="#d97757" rx="3"/>
    <text x="60" y="222" text-anchor="middle" font-size="10" fill="white">PV-BES-负荷</text>
    <rect x="0" y="233" width="120" height="22" fill="#788c5d" rx="3"/>
    <text x="60" y="248" text-anchor="middle" font-size="10" fill="white">参数优化</text>
  </g>

  <!-- ========== RIGHT PANEL - METHODOLOGY ========== -->
  <g transform="translate(960, 140)">
    <!-- TGD explanation -->
    <rect x="0" y="0" width="200" height="60" fill="#f3f4f6" rx="6"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">TGD &lt; 5%</text>
    <text x="100" y="45" text-anchor="middle" font-size="11" fill="#666">电网依赖率阈值</text>

    <!-- Key insight -->
    <rect x="0" y="75" width="200" height="80" fill="#fef3c7" rx="6"/>
    <text x="100" y="98" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">关键发现</text>
    <text x="100" y="118" text-anchor="middle" font-size="10" fill="#78350f">凌晨光周期 →</text>
    <text x="100" y="135" text-anchor="middle" font-size="10" fill="#78350f">储能需求 -40%</text>

    <!-- Validation badge -->
    <rect x="0" y="170" width="200" height="50" fill="#ecfdf5" rx="6"/>
    <text x="100" y="193" text-anchor="middle" font-size="11" fill="#065f46" font-weight="bold">✓ 实测数据验证</text>
    <text x="100" y="210" text-anchor="middle" font-size="10" fill="#059669">全年运营数据 (2024)</text>

    <!-- Open source badge -->
    <rect x="0" y="235" width="200" height="45" fill="#eff6ff" rx="6"/>
    <text x="100" y="258" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">⚡ 开源框架</text>
    <text x="100" y="273" text-anchor="middle" font-size="10" fill="#3b82f6">GitHub: VFED</text>
  </g>

  <!-- ========== BOTTOM ATTRIBUTION ========== -->
  <rect x="0" y="600" width="1200" height="30" fill="#f3f4f6"/>
  <text x="600" y="618" text-anchor="middle" font-size="11" fill="#6b7280">上海交通大学 · 熊元科 鲍华等 · Energy and Buildings (Under Review)</text>

  <!-- ========== DECORATIVE ELEMENTS ========== -->
  <!-- Pixel dots decoration -->
  <rect x="30" y="30" width="6" height="6" fill="#d97757" opacity="0.4"/>
  <rect x="42" y="30" width="6" height="6" fill="#4285f4" opacity="0.4"/>
  <rect x="54" y="30" width="6" height="6" fill="#788c5d" opacity="0.4"/>

  <rect x="1140" y="30" width="6" height="6" fill="#d97757" opacity="0.4"/>
  <rect x="1152" y="30" width="6" height="6" fill="#4285f4" opacity="0.4"/>
  <rect x="1164" y="30" width="6" height="6" fill="#788c5d" opacity="0.4"/>

  <rect x="30" y="575" width="6" height="6" fill="#d97757" opacity="0.4"/>
  <rect x="42" y="575" width="6" height="6" fill="#4285f4" opacity="0.4"/>
  <rect x="54" y="575" width="6" height="6" fill="#788c5d" opacity="0.4"/>

  <rect x="1140" y="575" width="6" height="6" fill="#d97757" opacity="0.4"/>
  <rect x="1152" y="575" width="6" height="6" fill="#4285f4" opacity="0.4"/>
  <rect x="1164" y="575" width="6" height="6" fill="#788c5d" opacity="0.4"/>
</svg>
